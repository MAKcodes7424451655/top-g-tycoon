<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top G Tycoon</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Top G Tycoon</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#game-interface">Game Interface</a></li>
        </ul>
    </nav>
    <section id="dashboard">
        <h2>Dashboard</h2>
        <div class="stats">
            <p>Money: <span id="money">$0</span></p>
            <p>Level: <span id="level">1</span></p>
            <p>Experience: <span id="experience">0</span></p>
        </div>
    </section>
    <section id="game-interface">
        <h2>Game Interface</h2>
        <div class="ui-elements">
            <button id="start-game">Start Game</button>
            <button id="end-game">End Game</button>
            <div class="game-actions">
                <button class="action-btn">Action 1</button>
                <button class="action-btn">Action 2</button>
                <button class="action-btn">Action 3</button>
            </div>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Top G Tycoon. All rights reserved.</p>
    </footer>
</body>
</html>
